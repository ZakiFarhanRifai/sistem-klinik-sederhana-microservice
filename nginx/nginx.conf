upstream api_gateway {
    server api-gateway:3000;
}

upstream graphql_gateway {
    server graphql-gateway:4000;
}

upstream product_service {
    server patient-service:3001;
}

upstream doctor_service {
    server doctor-service:3002;
}

upstream appointment_service {
    server appointment-service:3003;
}

upstream medical_record_service {
    server medical-record-service:3004;
}

server {
    listen 80;
    server_name localhost;

    # Semua request lewat API Gateway
    location /api/ {
        proxy_pass http://api_gateway/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # GraphQL Gateway
    location /graphql {
        proxy_pass http://graphql_gateway/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Akses langsung tiap service (opsional, untuk debugging)
    location /patients/ {
        proxy_pass http://product_service/patients/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /doctors/ {
        proxy_pass http://doctor_service/doctors/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /appointments/ {
        proxy_pass http://appointment_service/appointments/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /records/ {
        proxy_pass http://medical_record_service/records/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}